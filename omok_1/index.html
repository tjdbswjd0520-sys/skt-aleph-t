<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <!-- 모바일에서도 화면이 정상적으로 보이도록 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>멀티플레이어 오목</title>

  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       로비 화면
  ========================== -->
  <div id="lobby" class="screen">

    <h1>멀티플레이어 오목</h1>

    <!-- 닉네임 -->
    <div class="input-area">
      <input
        type="text"
        id="nickname"
        placeholder="닉네임을 입력하세요"
        maxlength="10"
      >
    </div>

    <!-- 방 만들기 -->
    <div class="room-box">

      <h2>방 만들기</h2>

      <button id="createRoomButton">
        방 만들기
      </button>

    </div>

    <!-- 방 참가 -->
    <div class="room-box">

      <h2>방 참가</h2>

      <input
        type="text"
        id="roomCodeInput"
        placeholder="방 코드 입력"
        maxlength="6"
      >

      <button id="joinRoomButton">
        방 참가
      </button>

    </div>

    <p id="lobbyMessage"></p>

  </div>


  <!-- =========================
       대기실 화면
  ========================== -->
  <div id="waitingRoom" class="screen hidden">

    <h1>게임 대기실</h1>

    <div class="room-code-area">

      <p>방 코드</p>

      <strong id="roomCodeDisplay">------</strong>

      <p class="small-text">
        다른 플레이어에게 이 코드를 알려주세요.
      </p>

    </div>

    <h2>참가자</h2>

    <div id="playerList"></div>

    <button
      id="startGameButton"
      class="start-button hidden"
    >
      게임 시작
    </button>

    <p id="waitingMessage"></p>

  </div>


  <!-- =========================
       게임 화면
  ========================== -->
  <div id="gameScreen" class="screen hidden">

    <h1>멀티플레이어 오목</h1>

    <!-- 현재 게임 정보 -->
    <div class="game-info">

      <div>
        방 코드:
        <strong id="gameRoomCode"></strong>
      </div>

      <div>
        내 닉네임:
        <strong id="myNickname"></strong>
      </div>

      <div>
        현재 차례:
        <strong id="turnText"></strong>
      </div>

    </div>


    <!-- 힌트 -->
    <div id="hintBox" class="hint-box hidden">

      <h2>힌트</h2>

      <p>
        이전 플레이어가 선택한 위치에 대한 힌트입니다.
      </p>

      <div id="hint1" class="hint"></div>
      <div id="hint2" class="hint"></div>

      <p class="hint-warning">
        두 힌트 중 어느 것이 진짜인지 알 수 없습니다.
      </p>

    </div>


    <!-- 오목판 -->
    <div class="board-wrapper">

      <div id="board"></div>

    </div>


    <!-- 결과 -->
    <div id="resultBox" class="result-box hidden">

      <h2 id="resultTitle"></h2>

      <p id="resultText"></p>

    </div>

  </div>


  <!-- Firebase SDK -->
  <script type="module">

    /*
      Firebase SDK를 인터넷에서 불러옵니다.
    */

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      get,
      update,
      onValue
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /*
      Firebase 프로젝트 설정
    */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCAHF4oG1d45MULnrAuRgEg9MlWijPzmmw",

      authDomain:
        "multiplayer-omok.firebaseapp.com",

      databaseURL:
        "https://multiplayer-omok-default-rtdb.asia-southeast1.firebasedatabase.app/",

      projectId:
        "multiplayer-omok",

      storageBucket:
        "multiplayer-omok.firebasestorage.app",

      messagingSenderId:
        "994594622673",

      appId:
        "1:994594622673:web:5ecd6ab2d4aa73830189f0"

    };


    // Firebase 시작
    const app = initializeApp(firebaseConfig);

    // Realtime Database 연결
    const database = getDatabase(app);


    /*
      game.js가 Firebase에 접근할 수 있도록
      전역 객체로 전달합니다.
    */

    window.firebaseGame = {

      database,
      ref,
      set,
      get,
      update,
      onValue

    };

    /*
      실제 게임 코드 실행
    */

    const script = document.createElement("script");

    script.src = "game.js";

    script.type = "module";

    document.body.appendChild(script);

  </script>

</body>
</html>
