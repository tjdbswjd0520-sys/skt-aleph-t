<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <!-- 모바일 화면에 맞게 크기 조절 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>나를 소개합니다</title>

    <style>

        /* =========================================
           기본 설정
        ========================================= */

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            /* 첫 번째 버전과 동일하게 화면 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;

            /* 기본 배경 */
            background-color: #f3efe7;

            font-family: Arial, "Noto Sans KR", sans-serif;

            /* 배경 그라데이션 전환 */
            transition: background 0.8s ease;

            overflow: hidden;
        }


        /* =========================================
           자기소개 전체 영역
           첫 번째 버전의 위치 유지
        ========================================= */

        .container {
            width: 90%;
            max-width: 900px;

            text-align: center;

            /*
                첫 번째 버전과 동일한 여백
            */
            padding: 40px 20px;

            /*
                제목과 버튼의 위치를 유지하기 위해
                relative를 사용
            */
            position: relative;

            z-index: 20;
        }


        /* =========================================
           안녕하세요
           첫 번째 버전의 위치 유지
        ========================================= */

        h1 {
            /*
                첫 번째 버전과 동일
            */
            margin: 0 0 50px;

            font-size: clamp(40px, 8vw, 80px);

            font-weight: 700;

            color: #222;
        }


        /* =========================================
           버튼 영역
           첫 번째 버전의 위치 유지
        ========================================= */

        .buttons {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 15px;
        }


        /* 버튼 */
        .intro-button {
            padding: 15px 22px;

            border: 1px solid #333;

            border-radius: 30px;

            background-color: rgba(243, 239, 231, 0.6);

            color: #333;

            font-size: 16px;

            cursor: pointer;

            transition: all 0.25s ease;

            position: relative;

            z-index: 30;
        }


        /* 마우스를 올렸을 때 */
        .intro-button:hover {
            background-color: #333;

            color: white;

            transform: translateY(-3px);
        }


        /* 클릭했을 때 */
        .intro-button:active {
            transform: scale(0.95);
        }


        /* =========================================
           화면에 등장하는 단어
        ========================================= */

        .word {
            /*
                화면 전체를 기준으로 배치
            */
            position: fixed;

            z-index: 10;

            /*
                긴 문장도 화면 밖으로 나가지 않도록 함
            */
            max-width: 70vw;

            text-align: center;

            font-size: clamp(20px, 4vw, 45px);

            font-weight: bold;

            color: #222;

            pointer-events: none;

            /*
                등장 → 유지 → 사라짐
            */
            animation:
                appearAndDisappear 2.5s ease-in-out forwards;
        }


        /* =========================================
           단어 애니메이션
        ========================================= */

        @keyframes appearAndDisappear {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.5);
            }

            20% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            70% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.05);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(1.3);
            }
        }


        /* =========================================
           모바일
        ========================================= */

        @media (max-width: 600px) {

            /*
                첫 번째 버전의 모바일 구조 유지
            */
            .container {
                padding: 30px 15px;
            }


            h1 {
                margin-bottom: 40px;
            }


            .buttons {
                flex-direction: column;

                align-items: center;
            }


            .intro-button {
                width: 100%;

                max-width: 320px;

                padding: 14px 15px;

                font-size: 15px;
            }


            .word {
                max-width: 75vw;

                font-size: clamp(18px, 6vw, 32px);
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         자기소개 메인 영역
    ========================================= -->

    <main class="container">

        <!-- 첫 번째 버전과 동일한 위치 -->
        <h1>안녕하세요</h1>


        <!-- 첫 번째 버전과 동일한 버튼 구조 -->
        <div class="buttons">

            <button
                class="intro-button"
                onclick="showWords(personalityWords)">

                저는 어떤 사람이냐면요

            </button>


            <button
                class="intro-button"
                onclick="showWords(likeWords)">

                제가 좋아하는 건요

            </button>


            <button
                class="intro-button"
                onclick="showWords(experienceWords)">

                저는 이런 일이 있었어요

            </button>

        </div>

    </main>



    <script>

        /* =========================================
           자기소개 내용
        ========================================= */


        // 성격
        const personalityWords = [
            "내성적",
            "호기심",
            "조용함",
            "충동적"
        ];


        // 좋아하는 것
        const likeWords = [
            "도넛",
            "아이스크림",
            "종이",
            "산책",
            "인체그리기"
        ];


        // 경험
        const experienceWords = [
            "고등학교 정보 과목 1등급",
            "대학교 C프로그래밍 & 자료구조 과목 A+",
            "9모에서 지구과학 8등급"
        ];



        /* =========================================
           랜덤 그라데이션 색상
        ========================================= */

        const gradientColors = [
            "#ffecd2",
            "#fcb69f",
            "#a1c4fd",
            "#c2e9fb",
            "#d4fc79",
            "#96e6a1",
            "#fbc2eb",
            "#a6c1ee",
            "#84fab0",
            "#8fd3f4",
            "#fccb90",
            "#d57eeb"
        ];


        /* 랜덤 색상 선택 */
        function getRandomColor() {

            const randomIndex =
                Math.floor(
                    Math.random() *
                    gradientColors.length
                );

            return gradientColors[randomIndex];
        }


        /* =========================================
           랜덤 그라데이션 적용
        ========================================= */

        function changeBackground() {

            let color1 = getRandomColor();

            let color2 = getRandomColor();


            /* 같은 색이면 다시 선택 */
            while (color1 === color2) {

                color2 = getRandomColor();

            }


            document.body.style.background =
                `linear-gradient(
                    135deg,
                    ${color1},
                    ${color2}
                )`;
        }


        /* =========================================
           원래 배경으로 복귀
        ========================================= */

        function resetBackground() {

            document.body.style.background =
                "#f3efe7";
        }



        /* =========================================
           단어가 기존 요소와 겹치는지 확인
        ========================================= */

        function isOverlapping(rect1, rect2, gap) {

            /*
                두 사각형이 겹치는지 확인합니다.

                gap을 추가해서 단어 사이에
                여유 공간도 만들어 줍니다.
            */

            return (
                rect1.left <
                    rect2.right + gap &&

                rect1.right >
                    rect2.left - gap &&

                rect1.top <
                    rect2.bottom + gap &&

                rect1.bottom >
                    rect2.top - gap
            );
        }



        /* =========================================
           단어 표시
        ========================================= */

        function showWords(words) {

            /* -------------------------------------
               배경 변경
            ------------------------------------- */

            changeBackground();


            /* -------------------------------------
               기존 단어 삭제
            ------------------------------------- */

            document
                .querySelectorAll(".word")
                .forEach(function(word) {

                    word.remove();

                });



            /* -------------------------------------
               안녕하세요와 버튼의 실제 좌표 확인
            ------------------------------------- */

            const title =
                document.querySelector("h1");


            const buttons =
                document.querySelector(".buttons");


            /*
                제목의 실제 화면 좌표
            */
            const titleRect =
                title.getBoundingClientRect();


            /*
                버튼의 실제 화면 좌표
            */
            const buttonRect =
                buttons.getBoundingClientRect();



            /*
                제목과 버튼 주변에
                충분한 안전거리 추가
            */

            const safeGap = 30;


            /*
                단어가 절대로 들어가면 안 되는
                '안녕하세요 + 버튼' 영역을 하나로 만듭니다.

                화면 중앙에 있는 이 영역을 피해서
                단어가 좌우 공간 등에 나타납니다.
            */

            const forbiddenArea = {

                left:
                    titleRect.left - safeGap,

                right:
                    titleRect.right + safeGap,

                top:
                    titleRect.top - safeGap,

                bottom:
                    buttonRect.bottom + safeGap

            };



            /* -------------------------------------
               이미 배치한 단어 위치 저장
            ------------------------------------- */

            const placedWords = [];



            /* -------------------------------------
               단어 생성
            ------------------------------------- */

            words.forEach(function(word, index) {


                /*
                    새로운 span 생성
                */
                const wordElement =
                    document.createElement("span");


                wordElement.textContent =
                    word;


                wordElement.classList.add("word");


                /*
                    먼저 화면에 넣어서
                    실제 크기를 측정합니다.
                */
                document.body.appendChild(
                    wordElement
                );


                const wordWidth =
                    wordElement.offsetWidth;


                const wordHeight =
                    wordElement.offsetHeight;



                let positionFound = false;

                let finalX = 0;

                let finalY = 0;



                /* ---------------------------------
                   적절한 위치를 최대 200번 탐색
                --------------------------------- */

                for (
                    let attempt = 0;
                    attempt < 200;
                    attempt++
                ) {


                    /*
                        화면 가장자리와
                        충분한 거리를 둡니다.
                    */

                    const minX =
                        wordWidth / 2 + 20;


                    const maxX =
                        window.innerWidth -
                        wordWidth / 2 -
                        20;


                    const minY =
                        wordHeight / 2 + 20;


                    const maxY =
                        window.innerHeight -
                        wordHeight / 2 -
                        20;



                    /*
                        랜덤 좌표 생성
                    */

                    const randomX =
                        Math.random() *
                        (maxX - minX) +
                        minX;


                    const randomY =
                        Math.random() *
                        (maxY - minY) +
                        minY;



                    /*
                        새 단어가 차지할 공간
                    */

                    const newRect = {

                        left:
                            randomX -
                            wordWidth / 2,

                        right:
                            randomX +
                            wordWidth / 2,

                        top:
                            randomY -
                            wordHeight / 2,

                        bottom:
                            randomY +
                            wordHeight / 2
                    };



                    /* ---------------------------------
                       제목/버튼 영역과 겹치는지 확인
                    --------------------------------- */

                    if (
                        isOverlapping(
                            newRect,
                            forbiddenArea,
                            0
                        )
                    ) {

                        /*
                            겹치면 이 위치를 버리고
                            다시 랜덤 위치를 찾습니다.
                        */

                        continue;
                    }



                    /* ---------------------------------
                       다른 단어와 겹치는지 확인
                    --------------------------------- */

                    let wordOverlap = false;


                    for (
                        const oldRect
                        of placedWords
                    ) {

                        if (
                            isOverlapping(
                                newRect,
                                oldRect,
                                30
                            )
                        ) {

                            wordOverlap = true;

                            break;
                        }
                    }



                    /*
                        다른 단어와도 겹치지 않는다면
                        이 위치를 사용합니다.
                    */

                    if (!wordOverlap) {

                        finalX = randomX;

                        finalY = randomY;


                        /*
                            위치를 저장해서
                            다음 단어와 겹치지 않게 합니다.
                        */
                        placedWords.push(newRect);


                        positionFound = true;

                        break;
                    }

                }



                /* ---------------------------------
                   위치를 찾지 못한 경우
                --------------------------------- */

                if (!positionFound) {

                    /*
                        충분히 탐색했는데도
                        공간이 없다면 단어를 화면에
                        표시하지 않습니다.

                        이것이 단어가 제목이나 버튼 위에
                        강제로 나타나는 것을 방지합니다.
                    */

                    wordElement.remove();

                    return;
                }



                /* ---------------------------------
                   최종 위치 적용
                --------------------------------- */

                wordElement.style.left =
                    finalX + "px";


                wordElement.style.top =
                    finalY + "px";


                /*
                    단어마다 조금씩 늦게 등장
                */
                wordElement.style.animationDelay =
                    (index * 0.15) + "s";



                /* ---------------------------------
                   애니메이션이 끝나면 삭제
                --------------------------------- */

                setTimeout(function() {

                    wordElement.remove();

                }, 3000 + (index * 150));

            });



            /* -------------------------------------
               모든 단어가 사라지면
               원래 배경으로 돌아감
            ------------------------------------- */

            const totalTime =
                3000 +
                ((words.length - 1) * 150);


            setTimeout(function() {

                resetBackground();

            }, totalTime + 200);

        }

    </script>

</body>
</html>
